name: project_dapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.4.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.0
  shared_preferences: ^2.3.2
  provider: ^6.1.0
  # Sui 錢包整合
  url_launcher: ^6.2.0
  flutter_secure_storage: ^9.0.0
  # WalletConnect for mobile wallet integration (暫時移除，與 socket_io_client v3 不兼容)
  # walletconnect_flutter_v2: ^2.1.0
  # qr_flutter: ^4.1.0
  # 地圖搜尋功能
  flutter_typeahead: ^4.8.0
  # WebView for Sui dApp integration
  webview_flutter: ^4.4.2
  # WebSocket 支援
  socket_io_client: ^3.0.2  # 升級到 3.0.2，支持 Socket.IO v4
  uni_links: ^0.5.1
  # Firebase 推送通知
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^19.5.0
  # GPS 定位功能
  geolocator: ^12.0.0
  crypto: ^3.0.7
  # zkLogin 非託管登入：OAuth（需注入 nonce → 用 AppAuth）+ 臨時 ed25519 金鑰
  flutter_appauth: ^7.0.1
  ed25519_edwards: ^0.3.1
  # Sui 交易簽名需 blake2b-256（intent message 摘要）
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Flutter 3.35 + iOS 26 的 LLDB 偵錯器常掛不上，app 會停在啟動畫面（白屏）。
  # 關掉 LLDB 只影響 debug 啟動方式，hot reload / 除錯輸出不受影響。
  config:
    enable-lldb-debugging: false
  uses-material-design: true
  assets:
    - assets/vehicles.json
    - assets/car_icon.png
