# 最外層驗證迴圈：不依賴任何人記得跑測試。
# 對應 CLAUDE.md §3 驗證迴圈的前兩列（Move build/test + 後端整合測試）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  move:
    name: Move build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI（對齊 Move.toml 釘的 testnet-v1.53.2）
        run: |
          curl -sSfL -o sui.tgz \
            https://github.com/MystenLabs/sui/releases/download/testnet-v1.53.2/sui-testnet-v1.53.2-ubuntu-x86_64.tgz
          mkdir -p "$HOME/sui-bin"
          tar -xzf sui.tgz -C "$HOME/sui-bin"
          echo "$HOME/sui-bin" >> "$GITHUB_PATH"
      - name: sui move build
        working-directory: contracts
        run: sui move build
      - name: sui move test
        working-directory: contracts
        run: sui move test

  backend:
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      # conftest.py 自備最小環境變數與全 fake 外部依賴，不需 DB/鏈/Walrus。
      - name: pytest tests/integration
        working-directory: backend
        run: python -m pytest tests/integration -q

  mobile:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 釘版本（對齊本機開發的 3.35.2），與 Move job 釘 sui CLI 同理。
          # 不釘會抓最新 stable，新版 analyzer 可能把既有 warning 升級成 error 導致漂移失敗。
          flutter-version: 3.35.2
          channel: stable
      # tracked 的 config 直接 import gitignored 的 *.local.dart；
      # CI 用 .example 補位（已驗證符號一致），只做靜態分析與測試、不需真值。
      - name: 補上 local config 替身
        working-directory: mobile/lib/config
        run: |
          cp app_config.local.dart.example app_config.local.dart
          cp google_maps_config.local.dart.example google_maps_config.local.dart
          cp map_config.local.dart.example map_config.local.dart
      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get
      # 專案通過標準是「0 error」（現存 17 warning / 402 info 留待清理，見 roadmap §8 2026-08-13）
      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: flutter test
        working-directory: mobile
        run: flutter test
